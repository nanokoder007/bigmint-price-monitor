name: Collect BigMint prices

on:
  schedule:
    - cron: "30 18 * * *" # 12:00 AM IST
    - cron: "30 0 * * *"  # 6:00 AM IST
    - cron: "30 6 * * *"  # 12:00 PM IST
    - cron: "30 12 * * *" # 6:00 PM IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bigmint-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Collect and store prices
        env:
          BIGMINT_COOKIE: ${{ secrets.BIGMINT_COOKIE }}
        run: python scripts/collect.py
      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/history.json docs/sources.json
          if ! git diff --cached --quiet; then
            git commit -m "Update BigMint price history"
            git push
          else
            echo "No data changes to commit"
          fi
